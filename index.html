<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white flex flex-col items-center justify-center p-6 min-h-screen">

    <div class="w-full max-w-5xl flex-1">
        <div id="editorTab" contenteditable="true"
            class="bg-black text-white rounded-lg p-4 focus:outline-none text-lg font-mono text-left whitespace-pre-wrap break-words"
            spellcheck="false"></div>
    </div>

    <div class="fixed bottom-4 w-full text-center text-sm text-gray-400">
        This is a simple web editor. No database, no saving—just write and share via URL.
    </div>

    <script type="module" src="index.js"></script>
</body>

</html>
